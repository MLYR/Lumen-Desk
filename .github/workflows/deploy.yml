name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_DIR: /opt/lumen-desk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.18.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm -r test

      - name: Build web
        env:
          # 在仓库的 Settings -> Variables 里设置；没设置时页面不会插入统计脚本。
          PUBLIC_UMAMI_SRC: ${{ vars.PUBLIC_UMAMI_SRC }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
        run: pnpm --filter web build

      - name: Upload public site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-public
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload private console
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-private
          path: apps/web/dist-private/
          if-no-files-found: error
          retention-days: 7

      - name: Upload blog shell
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-shell
          path: apps/web/dist-shell/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    # 服务器在国内，直接拉 GitHub / Docker Hub 很慢，所以在 CI 里构建镜像并把产物传过去。
    # secrets 不能用于 if，所以用 vars 作为开关。
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download public site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-public
          path: apps/web/dist/

      - name: Download private console
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-private
          path: apps/web/dist-private/

      - name: Download blog shell
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-shell
          path: apps/web/dist-shell/

      - name: Build API image
        run: |
          docker build -f apps/api/Dockerfile -t lumen-desk-api:latest .
          docker save lumen-desk-api:latest | gzip > "$RUNNER_TEMP/lumen-desk-api.tar.gz"

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync static files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          RSYNC_SSH="ssh -i $HOME/.ssh/id_deploy -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes"
          ssh -i "$HOME/.ssh/id_deploy" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p $DEPLOY_DIR/web/public $DEPLOY_DIR/web/private $DEPLOY_DIR/web/shell $DEPLOY_DIR/data"
          rsync -az --delete -e "$RSYNC_SSH" apps/web/dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/web/public/"
          rsync -az --delete -e "$RSYNC_SSH" apps/web/dist-private/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/web/private/"
          rsync -az --delete -e "$RSYNC_SSH" apps/web/dist-shell/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/web/shell/"

      - name: Ship config and image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          SCP_OPTS=(-i "$HOME/.ssh/id_deploy" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes)
          TARGET="$DEPLOY_USER@$DEPLOY_HOST"
          scp "${SCP_OPTS[@]}" deploy/Caddyfile deploy/docker-compose.yml "$TARGET:$DEPLOY_DIR/"
          scp "${SCP_OPTS[@]}" "$RUNNER_TEMP/lumen-desk-api.tar.gz" "$TARGET:$DEPLOY_DIR/lumen-desk-api.tar.gz"

      - name: Load image and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/id_deploy" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<EOF
          set -euo pipefail
          cd "$DEPLOY_DIR"
          gunzip -c lumen-desk-api.tar.gz | docker load
          rm -f lumen-desk-api.tar.gz
          # 上传目录：api 容器里的 node 用户（uid 1000）要能写，caddy 只读。
          # 部署用户不一定是 uid 1000，所以借 api 镜像里的 root 来 chown 和 chmod，不需要 sudo。
          mkdir -p data/uploads
          docker run --rm --user root --entrypoint sh -v "$DEPLOY_DIR/data:/data" lumen-desk-api:latest -c 'chown 1000:1000 /data/uploads && chmod 755 /data/uploads'
          # 第三方镜像先拉好；拉失败时如果本地已有就继续用旧的。
          docker compose pull --ignore-pull-failures caddy umami umami-db uptime-kuma
          docker compose up -d --no-build --remove-orphans
          # Caddyfile 是挂载进去的文件，只改它时 up -d 不会重建 caddy；又因为 admin off 不能 reload，所以重启一次（中断约 1 秒）。
          docker compose restart caddy
          docker compose ps
          EOF

      - name: Smoke test
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # 容器刚启动需要几秒，最多重试 12 次（约 1 分钟）。
          ssh -i "$HOME/.ssh/id_deploy" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_DIR='$DEPLOY_DIR' bash -s" <<'EOF'
          set -u
          cd "$DEPLOY_DIR"
          for i in $(seq 1 12); do
            if curl -fsS http://127.0.0.1/api/healthz \
              && [ "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q api)")" = healthy ]; then
              echo
              echo "冒烟检查通过"
              exit 0
            fi
            sleep 5
          done
          echo "冒烟检查失败：healthz 或 api 容器健康状态不正常" >&2
          docker compose ps >&2
          exit 1
          EOF

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_deploy
