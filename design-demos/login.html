<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>登录 · zreo 控制台</title>
<script>
  window.resolveTheme = function (mode) {
    if (mode === 'paper' || mode === 'blueprint') return mode;
    var h = new Date().getHours();
    return h >= 6 && h < 18 ? 'paper' : 'blueprint';
  };
  document.documentElement.dataset.theme = resolveTheme(new URLSearchParams(location.search).get('theme') || localStorage.getItem('themeMode') || 'auto');
</script>
<link rel="stylesheet" href="theme.css">
<style>
body { display: grid; place-items: center; padding: 24px; }
.box { width: min(400px, 100%); }
.box .card { padding: 28px; }
[data-theme="paper"] .box .card { padding: 24px 0 0; border-left: 0; }
h1 { font-family: var(--display); font-weight: var(--display-weight); font-size: 28px; line-height: 1.2; margin-bottom: 6px; }
.sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
label { display: block; font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.field { display: flex; align-items: center; height: 48px; padding: 0 14px; border: 1px solid var(--line); background: var(--panel); margin-bottom: 16px; }
.field:focus-within { border-color: var(--accent); }
.field input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 16px; }
.otp { height: 64px; }
.otp input { font-family: var(--mono); font-size: 28px; letter-spacing: .5em; text-align: center; padding-left: .5em; }
.submit { width: 100%; height: 48px; border: 0; background: var(--accent); color: var(--accent-fg); font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 4px; }
.note { margin-top: 18px; font-size: 13px; color: var(--muted); line-height: 1.6; }
.back { display: inline-block; margin-top: 20px; font-size: 13px; color: var(--muted); }
.back:hover { color: var(--accent); }
.err { display: none; color: var(--accent); font-size: 13px; margin-bottom: 12px; }
</style>
</head>
<body>
<main class="box">
  <a class="brand" href="site.html" style="margin-bottom:20px"><span class="brand-mark">z</span>zreo</a>
  <div class="card">
    <div class="coord">// PRIVATE AREA</div>
    <h1>控制台登录</h1>
    <p class="sub">打开 Google Authenticator，输入「zreo 控制台」的 6 位验证码。</p>
    <!-- 原型：不校验，输满 6 位直接进入控制台。正式版由后端校验 TOTP，下发 HttpOnly Cookie。 -->
    <form id="f">
      <label for="otp">验证码</label>
      <div class="field otp"><input id="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000" autofocus required></div>
      <div class="err" id="err">验证码不正确</div>
      <button class="submit" type="submit">进入控制台</button>
    </form>
    <p class="note">输满 6 位自动提交。连续失败 5 次锁定 15 分钟。登录状态在本设备保持 30 天。</p>
  </div>
  <a class="back" href="site.html">← 返回公开主页</a>
</main>
<script>
const f = document.getElementById("f"), otp = document.getElementById("otp");
f.addEventListener("submit", (e) => { e.preventDefault(); location.href = "navigator.html"; });
otp.addEventListener("input", () => {
  otp.value = otp.value.replace(/\D/g, "").slice(0, 6);
  if (otp.value.length === 6) f.requestSubmit();
});
</script>
</body>
</html>
